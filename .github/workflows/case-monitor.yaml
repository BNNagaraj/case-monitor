name: Case monitor

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Monitoring backend to run'
        required: false
        default: openai
        type: choice
        options:
          - scrape
          - openai
      no_fallback:
        description: 'Disable fallback to scraping when OpenAI is unavailable'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'openai' }}
      MONITOR_NO_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_fallback || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore last known hash
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: case-monitor.yaml
          branch: ${{ github.ref_name }}
          name: state
          path: .state
          if_no_artifact_found: ignore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run case monitor
        id: run-monitor
        run: |
          MODE="${MONITOR_MODE}"
          EXTRA_ARGS=""
          if [ "${MONITOR_NO_FALLBACK}" = "true" ]; then
            EXTRA_ARGS="--no-fallback"
          fi
          echo "Running case monitor in ${MODE} mode"
          python -m case_monitor --mode "${MODE}" ${EXTRA_ARGS}

      - name: Display summary
        run: cat result.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: case-monitor-${{ github.run_id }}
          path: |
            result.json
            page.png
          if-no-files-found: warn
          retention-days: 7

      - name: Persist state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: .state/last_hash.txt
          if-no-files-found: ignore
          retention-days: 30
